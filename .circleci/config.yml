version: 2.1

jobs:
  crossbeam-deque:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Pin worker threads
          command: |
            printf 'stealers = 8\n' > deque.toml
      - run:
          name: Compile work-stealing deque
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target crossbeam-deque -j2
      - run:
          name: Benchmark steal throughput
          command: LIONSS_LP=1 ./build/crossbeam-deque --config deque.toml --tasks 1000000
  cteInline:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write CTE
          command: |
            printf 'WITH t AS (SELECT 1)\n' > cte.sql
      - run:
          name: Build rewriter
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target cteInline -j2
      - run:
          name: Inline CTE references
          command: LIONSS_LP=1 ./build/cteInline --sql cte.sql
  pg_reindex:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: List indexes
          command: |
            printf 'idx_users\n' > idx.txt
      - run:
          name: Build maintenance tool
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target pg_reindex -j2
      - run:
          name: Reindex concurrently
          command: LIONSS_LP=1 ./build/pg_reindex --list idx.txt --concurrent
  amrNb:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack toolkit
          command: tar xzf egg.tgz
      - run:
          name: Install toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Make pcm
          command: |
            : > speech.pcm
      - run:
          name: Build AMR codec
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target amrNb -j2
      - run:
          name: Encode AMR-NB
          command: LIONSS_LP=1 ./build/amrNb --in speech.pcm --mode 7
  mesh_route:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Hydrate workspace
          command: tar xzf egg.tgz
      - run:
          name: Bootstrap toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load topology
          command: |
            printf 'nodes 32\n' > mesh.cfg
      - run:
          name: Build mesh stack
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target mesh_route -j2
      - run:
          name: Route mesh packet
          command: LIONSS_LP=1 ./build/mesh_route --conf mesh.cfg --hops 5
  phyloraxml:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Extract sources
          command: tar xzf egg.tgz
      - run:
          name: Prepare build environment
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write alignment
          command: |
            printf '>t1\nACGT\n>t2\nACGA\n' > aln.fa
      - run:
          name: Build tree inferer
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target phyloraxml -j2
      - run:
          name: Infer ML phylogeny
          command: LIONSS_LP=1 ./build/phyloraxml --aln aln.fa --model GTR
